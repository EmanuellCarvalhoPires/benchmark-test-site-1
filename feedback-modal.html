<!-- Componente Modal de Feedback para Teste de PR -->
<div id="feedbackModal" class="modal hidden">
  <div class="modal-content">
    <h3>Envie seu Feedback</h3>
    <textarea placeholder="Deixe seus comentários sobre o teste..."></textarea>
    <div class="modal-actions">
      <button id="btnSendFeedback" class="btn-primary">Enviar</button>
      <button id="btnCloseFeedback" class="btn-secondary">Cancelar</button>
    </div>
  </div>
</div>
